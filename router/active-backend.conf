# Initial production backend.
# Jenkins/scripts/switch-traffic.sh replaces this file
# inside the running orders-router container.

# ACTIVE_COLOR=blue

upstream orders_active {
    server orders-blue:3000;
}

server {
    listen 8080;

    location /router-status {
        default_type text/plain;
        return 200 "active-color: blue\n";
    }

    location / {
        proxy_pass http://orders_active;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
