worker_processes 1;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    sendfile on;

    # The active backend (upstream + server block) lives in a separate file
    # that the deploy scripts rewrite and this process reloads on Traffic
    # Switch. Keeping it separate means switching traffic never touches
    # this base file.
    include /etc/nginx/conf.d/active-backend.conf;
}
