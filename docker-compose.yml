networks:
  orders-network:
    name: orders-network
    external: true

volumes:
  orders-db-data:

services:

  orders-db:
    image: postgres:16-alpine
    container_name: orders-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_dev_password}

    volumes:
      - orders-db-data:/var/lib/postgresql/data

    networks:
      - orders-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U orders -d orders"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  orders-router:
    build:
      context: ./router
      dockerfile: Dockerfile

    image: orders-router:1.0

    container_name: orders-router
    restart: unless-stopped

    ports:
      - "8080:8080"

    networks:
      - orders-network

    depends_on:
      - orders-db
